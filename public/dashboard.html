<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvidenceHub dashboard</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; } body { margin: 0; } header { padding: 28px max(24px, calc((100% - 1120px) / 2)); background: #172033; color: white; }
    header p { color: #afbdd3; margin-bottom: 0; } main { max-width: 1120px; margin: 32px auto; padding: 0 24px; display: grid; gap: 24px; grid-template-columns: 280px 1fr; }
    section, aside { background: white; border: 1px solid #dce4ef; border-radius: 14px; padding: 22px; box-shadow: 0 4px 16px #1720330d; }
    h1, h2, h3 { margin-top: 0; } h1 { margin-bottom: 6px; } h2 { font-size: 19px; } label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
    input, select, button { width: 100%; border: 1px solid #c7d3e3; border-radius: 8px; padding: 10px; font: inherit; } button { cursor: pointer; background: #267a60; color: white; border: 0; font-weight: 700; margin-top: 16px; }
    button:hover { background: #1d624d; } .product { padding: 13px; border: 1px solid #dce4ef; border-radius: 9px; margin: 10px 0; cursor: pointer; } .product.selected { border-color: #267a60; background: #eef9f4; }
    .muted { color: #63728a; font-size: 14px; } .status { display: inline-block; padding: 6px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; } .compliant { color: #176044; background: #d9f4e8; } .action_required { color: #805b00; background: #fff0c2; } .incomplete { color: #9b3030; background: #fde0e0; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } .metric { padding: 14px; background: #f4f7fb; border-radius: 9px; } .metric strong { display: block; font-size: 24px; margin-top: 5px; }
    .evidence-card { border: 1px solid #dce4ef; border-radius: 9px; padding: 14px; margin: 10px 0; } .evidence-card header { display: flex; justify-content: space-between; gap: 12px; padding: 0; background: transparent; color: inherit; } .evidence-card header p { margin: 4px 0; color: #63728a; } .review-actions { display: flex; gap: 8px; margin-top: 12px; } .review-actions button { width: auto; margin: 0; padding: 8px 12px; } .review-actions .reject { background: #9b3030; } .audit { margin-top: 10px; padding-left: 18px; border-left: 2px solid #dce4ef; } .product-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; } .product-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; } .export-link { display: inline-block; padding: 9px 12px; border: 1px solid #267a60; border-radius: 8px; color: #267a60; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; } .export-link:hover { background: #eef9f4; } .share-button { width: auto; margin: 0; padding: 9px 12px; background: #174e3b; white-space: nowrap; } .renewal-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; } .renewal-toolbar select { width: auto; min-width: 130px; } .renewal-item { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #dce4ef; } .renewal-item:last-child { border-bottom: 0; } .renewal-item strong { display: block; } .renewal-item .expired { color: #9b3030; } .renewal-item .expiring_soon { color: #805b00; } .remind-button { width: auto; margin-top: 8px; padding: 7px 10px; }
    li { margin: 8px 0; } .notice { min-height: 20px; color: #9b3030; font-size: 14px; } @media (max-width: 760px) { main { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
    :root { --ink: #16231f; --ink-muted: #66756f; --paper: #fbfcf9; --line: #dbe5df; --green: #227254; --green-dark: #174e3b; --mint: #e9f5ef; --amber: #946d12; }
    body { color: var(--ink); background: linear-gradient(135deg, #f5f8f4 0%, #eef4f0 100%); font-family: "Aptos", "Segoe UI", sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    header { position: relative; padding-top: 34px; padding-bottom: 30px; background: var(--ink); border-bottom: 4px solid #9acbb2; }
    header h1 { letter-spacing: .01em; font-size: 30px; } header p { margin-top: 8px; letter-spacing: .02em; }
    header #logout { position: absolute; top: 32px; right: max(24px, calc((100% - 1120px) / 2)); width: auto; padding: 9px 14px; border: 1px solid #61746c; }
    main { margin-top: 38px; margin-bottom: 56px; } section, aside { background: rgba(255, 255, 255, .94); border-color: var(--line); border-radius: 10px; box-shadow: 0 14px 32px rgba(25, 54, 43, .08); }
    aside { position: sticky; top: 22px; align-self: start; } h2 { color: var(--ink); font-size: 20px; letter-spacing: -.01em; } h3 { color: var(--green-dark); font-size: 15px; letter-spacing: .01em; text-transform: uppercase; }
    input, select { background: var(--paper); border-color: #c7d6cd; } input:focus, select:focus { outline: 3px solid rgba(86, 166, 125, .2); border-color: var(--green); }
    button { background: var(--green); } button:hover { background: var(--green-dark); } .product { border-color: var(--line); background: #fff; transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease; } .product:hover { border-color: #86b89f; transform: translateY(-1px); box-shadow: 0 5px 12px rgba(25, 54, 43, .07); } .product.selected { border-color: var(--green); background: var(--mint); box-shadow: inset 3px 0 var(--green); }
    .metric { background: #f3f7f4; border: 1px solid #e2ebe5; } .metric strong { color: var(--green-dark); font-size: 27px; } .status { border: 1px solid transparent; } .compliant { color: #176044; background: #dff3e8; border-color: #b9dfca; } .action_required { color: var(--amber); background: #fff4cf; border-color: #ead797; } .incomplete { color: #9b3030; background: #fde6e3; border-color: #edc2bd; }
    .evidence-card { border-color: var(--line); background: #fff; } .renewal-item { border-color: #e4ece7; } .renewal-item:hover { background: #fafcfb; } .export-link { border-color: #9bc9b0; color: var(--green-dark); background: #f5fbf7; } .export-link:hover { border-color: var(--green); background: var(--mint); }
    footer { margin-top: auto; padding: 20px 24px; color: var(--ink-muted); font-size: 13px; text-align: center; }
    @media (max-width: 760px) { header #logout { position: static; margin-top: 18px; } header { padding-top: 26px; } main { margin-top: 24px; } aside { position: static; } .product-heading, .renewal-toolbar { align-items: flex-start; flex-direction: column; } .export-link { width: 100%; text-align: center; } }
  </style>
</head>
<body>
  <header><h1>EvidenceHub</h1><p>Evidence inventory and compliance workspace</p><button id="logout" style="max-width:120px;background:#52647e">Sign out</button></header>
  <main>
    <aside>
      <h2>Products</h2>
      <div id="products"><p class="muted">Loading products...</p></div>
      <h3>Add product</h3>
      <form id="product-form">
        <label for="product-name">Name</label><input id="product-name" required placeholder="e.g. Organic face cream">
        <label for="product-sku">SKU</label><input id="product-sku" required placeholder="e.g. FACE-001">
        <button>Create product</button>
      </form>
    </aside>
    <section id="detail"><h2>Select a product</h2><p class="muted">Create or select a product to manage its evidence.</p></section>
  </main>
  <footer>&copy; 2026 Mitch Ludcke</footer>
  <script>
    const state = { products: [], selected: null };
    const el = (id) => document.getElementById(id);
    async function api(path, options) {
      const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || body.error || "Request failed");
      return body;
    }
    async function loadProducts() {
      state.products = await api("/api/products");
      el("products").innerHTML = state.products.length ? state.products.map((p) =>
        `<div class="product ${state.selected?.id === p.id ? "selected" : ""}" data-id="${p.id}"><strong>${escapeHtml(p.name)}</strong><br><span class="muted">${escapeHtml(p.sku)}</span></div>`
      ).join("") : '<p class="muted">No products yet.</p>';
      document.querySelectorAll(".product").forEach((item) => item.addEventListener("click", () => selectProduct(item.dataset.id)));
    }
    async function selectProduct(id) {
      state.selected = state.products.find((p) => p.id === id);
      await loadProducts();
      const compliance = await api(`/api/products/${id}/compliance`);
      const documents = await api(`/api/products/${id}/documents`);
      el("detail").innerHTML = `<div class="product-heading"><h2>${escapeHtml(state.selected.name)} <span class="status ${compliance.status}">${compliance.status.replace("_", " ")}</span></h2><div class="product-actions"><a class="export-link" href="/api/products/${state.selected.id}/evidence-pack">Download evidence pack</a><button id="share-product" class="share-button">Create share link</button></div></div>
        <p class="muted">SKU ${escapeHtml(state.selected.sku)}</p>
        <div class="grid"><div class="metric">Required<strong>${compliance.requiredEvidence}</strong></div><div class="metric">Approved<strong>${compliance.approvedEvidence}</strong></div><div class="metric">Expiring soon<strong>${compliance.expiringEvidence}</strong></div></div>
        <div class="renewal-toolbar"><h3>Renewal queue</h3><select id="renewal-window" aria-label="Renewal window"><option value="30">Next 30 days</option><option value="60">Next 60 days</option><option value="90">Next 90 days</option></select></div><div id="renewal-list"><p class="muted">Checking renewal dates...</p></div>
        <h3>Missing requirements</h3>${compliance.missingRequirements.length ? `<ul>${compliance.missingRequirements.map(escapeHtml).map((x) => `<li>${x}</li>`).join("")}</ul>` : '<p class="muted">All required evidence is approved.</p>'}
        <h3>Evidence review queue</h3><div id="evidence-list">${documents.length ? documents.map(renderDocument).join("") : '<p class="muted">No evidence has been uploaded yet.</p>'}</div>
        <form id="requirement-form"><h3>Add evidence requirement</h3><label for="requirement-name">Requirement name</label><input id="requirement-name" required placeholder="e.g. Safety certificate"><button>Add requirement</button></form>
        <form id="document-form"><h3>Upload evidence</h3><label for="document-requirement">Requirement</label><select id="document-requirement"><option value="">Unassigned</option></select><label for="document-type">Document type</label><input id="document-type" required placeholder="e.g. Certificate"><label for="document-expiry">Expiry date</label><input id="document-expiry" type="date"><label for="document-file">File (PDF, PNG, JPEG; max 10 MB)</label><input id="document-file" type="file" accept=".pdf,.png,.jpg,.jpeg" required><button>Upload for review</button></form>
        <p id="notice" class="notice"></p>`;
      el("requirement-form").addEventListener("submit", addRequirement);
      el("share-product").addEventListener("click", () => createShareLink(id));
      el("renewal-window").addEventListener("change", (event) => loadRenewals(id, event.target.value));
      await loadRenewals(id, 30);
      const requirements = await api(`/api/products/${id}/requirements`);
      el("document-requirement").innerHTML = '<option value="">Unassigned</option>' + requirements.map((requirement) => `<option value="${requirement.id}">${escapeHtml(requirement.name)}</option>`).join("");
      el("document-form").addEventListener("submit", uploadDocument);
      document.querySelectorAll("[data-review-id]").forEach((button) => button.addEventListener("click", () => reviewDocument(button.dataset.reviewId, button.dataset.reviewAction)));
      await loadExtractions(documents);
    }
    async function loadRenewals(productId, days) {
      try {
        const renewals = await api(`/api/products/${productId}/renewals?days=${days}`);
        el("renewal-list").innerHTML = renewals.length ? renewals.map((renewal) => {
          const expiry = new Date(renewal.document.expiresAt).toLocaleDateString();
          const timing = renewal.renewalStatus === "expired" ? "Expired" : `${Math.max(renewal.daysUntilExpiry, 0)} days left`;
          return `<div class="renewal-item"><div><strong>${escapeHtml(renewal.document.fileName)}</strong><span class="muted">${escapeHtml(renewal.document.documentType)}${renewal.requirementName ? ` · ${escapeHtml(renewal.requirementName)}` : ""}</span><br><button class="remind-button" data-remind-id="${renewal.document.id}">Record reminder</button></div><div class="${renewal.renewalStatus}"><strong>${timing}</strong><span class="muted">${expiry}</span></div></div>`;
        }).join("") : '<p class="muted">No approved evidence needs renewal in this window.</p>';
        document.querySelectorAll("[data-remind-id]").forEach((button) => button.addEventListener("click", () => recordReminder(productId, button.dataset.remindId)));
      } catch (error) { el("renewal-list").textContent = error.message; }
    }
    async function recordReminder(productId, documentId) {
      try { await api(`/api/products/${productId}/documents/${documentId}/reminders`, { method: "POST" }); await loadRenewals(productId, el("renewal-window").value); }
      catch (error) { el("notice").textContent = error.message; }
    }
    async function createShareLink(productId) {
      const expiresInDays = Number(prompt("How many days should this link remain active?", "7"));
      if (!Number.isInteger(expiresInDays) || expiresInDays < 1 || expiresInDays > 30) return;
      try {
        const result = await api(`/api/products/${productId}/share-links`, { method: "POST", body: JSON.stringify({ expiresInDays }) });
        const shareUrl = new URL(result.url, location.origin).href;
        try { await navigator.clipboard.writeText(shareUrl); } catch { }
        el("notice").textContent = `Share link ready through ${new Date(result.expiresAt).toLocaleDateString()}: ${shareUrl}`;
      } catch (error) { el("notice").textContent = error.message; }
    }
    function renderDocument(document) {
      const label = document.status === "pending_review" ? "Awaiting review" : document.status.replace("_", " ");
      const actions = document.status === "approved" ? "" : `<div class="review-actions"><button data-review-id="${document.id}" data-review-action="approved">Approve</button><button class="reject" data-review-id="${document.id}" data-review-action="rejected">Reject</button><button class="reject" data-review-id="${document.id}" data-review-action="changes_requested">Request changes</button></div>`;
      return `<article class="evidence-card"><header><div><strong>${escapeHtml(document.fileName)}</strong><p>${escapeHtml(document.documentType)} · ${formatBytes(document.sizeBytes)}</p></div><span class="status ${document.status === "approved" ? "compliant" : document.status === "rejected" ? "incomplete" : "action_required"}">${escapeHtml(label)}</span></header><p class="muted">${document.expiresAt ? `Expires ${new Date(document.expiresAt).toLocaleDateString()}` : "No expiry date recorded"} · <a href="/api/products/${state.selected.id}/documents/${document.id}/download">Download</a></p><div id="extraction-${document.id}" class="audit muted">Checking extracted metadata...</div>${actions}<div id="audit-${document.id}" class="audit muted"></div></article>`;
    }
    async function loadExtractions(documents) {
      await Promise.all(documents.map(async (evidenceDocument) => {
        try { const extraction = await api(`/api/products/${state.selected.id}/documents/${evidenceDocument.id}/extraction`); const target = el(`extraction-${evidenceDocument.id}`); if (extraction.status === "ready_for_review") target.innerHTML = `<strong>Extracted metadata needs confirmation</strong><br>${extraction.suggestedDocumentType ? `Suggested type: ${escapeHtml(extraction.suggestedDocumentType)}<br>` : ""}${extraction.suggestedExpiresAt ? `Suggested expiry: ${new Date(extraction.suggestedExpiresAt).toLocaleDateString()}<br>` : ""}<button data-confirm-extraction="${evidenceDocument.id}" style="width:auto;padding:7px 10px">Confirm suggestions</button>`; else target.textContent = extraction.status === "manual_required" ? "Manual metadata entry required for this PDF." : `OCR status: ${extraction.status}`; const confirm = document.querySelector(`[data-confirm-extraction="${evidenceDocument.id}"]`); if (confirm) confirm.addEventListener("click", () => confirmExtraction(evidenceDocument.id, extraction)); }
        catch (error) { el(`extraction-${document.id}`).textContent = error.message; }
      }));
    }
    async function confirmExtraction(documentId, extraction) {
      const documentType = prompt("Confirm document type", extraction.suggestedDocumentType || "") || "";
      if (!documentType) return;
      const expiry = prompt("Confirm expiry date (YYYY-MM-DD), or leave blank", extraction.suggestedExpiresAt ? extraction.suggestedExpiresAt.slice(0, 10) : "");
      try { await api(`/api/products/${state.selected.id}/documents/${documentId}/extraction/confirm`, { method: "POST", body: JSON.stringify({ documentType, expiresAt: expiry ? new Date(`${expiry}T00:00:00.000Z`).toISOString() : null }) }); await selectProduct(state.selected.id); }
      catch (error) { el("notice").textContent = error.message; }
    }
    function formatBytes(bytes) { return bytes < 1024 ? `${bytes} B` : `${Math.round(bytes / 1024)} KB`; }
    async function reviewDocument(documentId, action) {
      const note = action === "approved" ? null : prompt(action === "rejected" ? "Why is this evidence being rejected?" : "What needs to be changed?");
      if (action !== "approved" && !note) return;
      try { await api(`/api/products/${state.selected.id}/documents/${documentId}/review`, { method: "POST", body: JSON.stringify({ action, note }) }); await selectProduct(state.selected.id); }
      catch (error) { el("notice").textContent = error.message; }
    }
    async function addRequirement(event) {
      event.preventDefault();
      try { await api(`/api/products/${state.selected.id}/requirements`, { method: "POST", body: JSON.stringify({ name: el("requirement-name").value, required: true }) }); await selectProduct(state.selected.id); }
      catch (error) { el("notice").textContent = error.message; }
    }
    async function uploadDocument(event) {
      event.preventDefault();
      const form = new FormData();
      form.append("file", el("document-file").files[0]);
      form.append("requirementId", el("document-requirement").value);
      form.append("documentType", el("document-type").value);
      if (el("document-expiry").value) form.append("expiresAt", new Date(`${el("document-expiry").value}T00:00:00.000Z`).toISOString());
      try { await fetch(`/api/products/${state.selected.id}/documents`, { method: "POST", body: form }).then(async (response) => { const body = await response.json(); if (!response.ok) throw new Error(body.error?.message || body.error || "Upload failed"); return body; }); await selectProduct(state.selected.id); }
      catch (error) { el("notice").textContent = error.message; }
    }
    el("product-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try { const product = await api("/api/products", { method: "POST", body: JSON.stringify({ organisationId: "default", name: el("product-name").value, sku: el("product-sku").value }) }); event.target.reset(); await loadProducts(); await selectProduct(product.id); }
      catch (error) { alert(error.message); }
    });
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char])); }
    document.getElementById("logout").addEventListener("click", async () => { await fetch("/api/auth/logout", { method: "POST" }); location.href = "/login.html"; });
    loadProducts().catch((error) => { if (error.message === "Authentication required") location.href = "/login.html"; else el("products").textContent = error.message; });
  </script>
</body>
</html>
